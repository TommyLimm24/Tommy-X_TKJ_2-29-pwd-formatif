<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nomor 2.3 - Formulir Kontak</title>
  <style>
    /* Universal selector untuk box-sizing */
    * {
      box-sizing: border-box;
    }

    /* 2. body (Tag): latar terang dan font dengan font cadangan */
    body {
      margin: 0;
      background-color: #f4f6f8;
      font-family: Arial, Helvetica, sans-serif;
    }

    /* 3. #contact (ID): padding 40px atas-bawah dan 20px kiri-kanan */
    #contact {
      padding: 40px 20px;
    }

    /* 4. .contact-form (Class): lebar 400px, berada di tengah halaman, padding 24px, dan border 1px solid */
    .contact-form {
      width: 400px;
      margin: 0 auto;
      background-color: #ffffff;
      padding: 24px;
      border: 1px solid #dcdde1;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
    }

    /* 5. .contact-form h2 (Descendant): rata tengah */
    .contact-form h2 {
      text-align: center;
      color: #1a2530;
      margin-top: 0;
      margin-bottom: 20px;
    }

    /* 6. .form-group (Class): margin bawah 16px */
    .form-group {
      margin-bottom: 16px;
    }

    /* 7. .form-group label (Descendant): display block, tulisan tebal, dan margin bawah 6px */
    .form-group label {
      display: block;
      font-weight: bold;
      margin-bottom: 6px;
      color: #333333;
      font-size: 14px;
    }

    /* 8. Grouping dan Descendant: .form-group input, .form-group textarea (lebar 100%, border-box, padding 10px, sudut membulat) */
    .form-group input,
    .form-group textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-family: inherit;
      font-size: 14px;
    }

    .form-group textarea {
      resize: vertical;
      height: 100px;
    }

    /* 9. Grouping dan Pseudo-class: .form-group input:focus, .form-group textarea:focus (warna latar atau garis tepi berubah saat diklik) */
    .form-group input:focus,
    .form-group textarea:focus {
      outline: none;
      border-color: #3498db;
      background-color: #f8fbff;
    }

    /* 10. .btn-submit (Class): berlatar warna, tulisan terbaca, sudut membulat */
    .btn-submit {
      background-color: #1a2530;
      color: #ffffff;
      padding: 10px 16px;
      border: none;
      border-radius: 4px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
    }

    /* 10. .btn-submit:hover (Pseudo-class): warnanya berubah */
    .btn-submit:hover {
      background-color: #3498db;
    }

    /* Footer / Tautan Kembali ke Beranda */
    footer {
      text-align: center;
      margin-top: 30px;
    }

    footer a {
      color: #6b46c1;
      text-decoration: underline;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <!-- section dengan id contact -->
  <section id="contact">
    <!-- form dengan class contact-form -->
    <form class="contact-form">
      <h2>Hubungi Saya</h2>

      <!-- div 1: form-group untuk Nama -->
      <div class="form-group">
        <label for="nama">Nama</label>
        <input type="text" id="nama" name="nama">
      </div>

      <!-- div 2: form-group untuk Email -->
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email">
      </div>

      <!-- div 3: form-group untuk Pesan -->
      <div class="form-group">
        <label for="pesan">Pesan</label>
        <textarea id="pesan" name="pesan"></textarea>
      </div>

      <!-- button dengan class btn-submit -->
      <button type="submit" class="btn-submit">Kirim Pesan</button>
    </form>
  </section>

  <footer>
    <a href="#">Kembali ke Beranda</a>
  </footer>

</body>
</html>
