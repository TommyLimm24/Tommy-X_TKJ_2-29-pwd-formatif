<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeri Proyek</title>
    <!-- Menghubungkan ke file CSS eksternal dengan tag link[cite: 6] -->
    <link rel="stylesheet" href="../styles/gallery.css">
</head>
<body>

    <!-- Main dengan id gallery[cite: 5] -->
    <main id="gallery">
        <section>
            <h2>Galeri Proyek</h2>
            
            <!-- Pembungkus enam kartu dengan class gallery[cite: 5] -->
            <div class="gallery">
                <!-- Kartu 1 -->
                <article class="gallery-item">
                    <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e" alt="Website Toko Online">
                    <h3>Website Toko Online</h3>
                </article>

                <!-- Kartu 2 -->
                <article class="gallery-item">
                    <img src="../assets/images/Bali.jpg" alt="Aplikasi Catatan">
                    <h3>Aplikasi Catatan</h3>
                </article>

                <!-- Kartu 3 -->
                <article class="gallery-item">
                    <img src="../assets/images/Tommy Lim.jpeg" alt="Blog Pribadi">
                    <h3>Blog Pribadi</h3>
                </article>

                <!-- Kartu 4 -->
                <article class="gallery-item">
                    <img src="https://images.unsplash.com/photo-1509198397868-475647b2a1e5" alt="Kalkulator Web">
                    <h3>Kalkulator Web</h3>
                </article>

                <!-- Kartu 5 -->
                <article class="gallery-item">
                    <img src="https://images.unsplash.com/photo-1433086966358-54859d0ed716" alt="Halaman Resep">
                    <h3>Halaman Resep</h3>
                </article>

                <!-- Kartu 6 -->
                <article class="gallery-item">
                    <img src="https://images.unsplash.com/photo-1519501025264-65ba15a82390" alt="Portofolio Foto">
                    <h3>Portofolio Foto</h3>
                </article>
            </div>
        </section>
    </main>

    <!-- Footer dengan tautan Kembali ke Beranda[cite: 5] -->
    <footer>
        <a href="#">Kembali ke Beranda</a>
    </footer>

</body>
</html>
